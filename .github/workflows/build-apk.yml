name: Build Karino APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: karino-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Karino-v1.3.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karino-APK-${{ github.run_number }}
          path: Karino-v1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
